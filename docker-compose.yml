services:
  media-manager:
    build: .
    container_name: media-manager
    restart: unless-stopped
    ports:
      - "26431:8000"
    volumes:
      # Persists config.yaml (settings saved from the web UI), the SQLite
      # database, and logs. Must be a real volume/bind mount or every
      # redeploy loses your settings and archive history.
      - media-manager-config:/config
      # Set MOVIES_HOST_PATH / TV_HOST_PATH in this stack's .env (not this
      # file -- keeps host-specific paths out of git). Whatever's already in
      # each folder is scanned in place by default (config.docker.yaml sets
      # incoming_movies == archive_movies, same for tv) -- if you do want a
      # separate staging folder per type instead, add another mount here and
      # repoint incoming_movies/incoming_tv from the Settings tab.
      - ${MOVIES_HOST_PATH:-/path/on/host/to/movies}:/media/movies
      - ${TV_HOST_PATH:-/path/on/host/to/tv}:/media/tv
    environment:
      TZ: "UTC"
      # Set TMDB_API_KEY in .env to lock the key via env instead of the
      # Settings UI (the Settings UI will show it as locked and refuse to
      # change it). Leave unset to configure it from the dashboard instead.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    # Uncomment and set to your host media owner's uid:gid if the app can't
    # write to /media/movies or /media/tv as root (check Settings > Test
    # Permissions first):
    # user: "1000:1000"

volumes:
  media-manager-config:
